<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de Formulário</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="screen">
        <div class="leftSide">
            <img src="imagens/img.png" alt="Imagem ilustrativa de login">
        </div>
        <div class="rightSide">
            <h1>Crie uma conta</h1>

            <form method="post" action="cadrastro.php" class="validator">
                <label>
                    Seu nome: <br>
                    <input type="text" name="nome" id="nome" data-rules="required|min=2">
                </label>

                  <label>
                    Seu e-mail: <br>
                    <input type="text" name="email" id="email" data-rules="required|email">
                </label>

                  <label>
                    Sua senha: <br>
                    <input type="password" name="password" id="password" data-rules="required|min=4">
                </label>

                  <label>
                    <input type="submit" value="Cadrastar">
                </label>

                <div>
                    Já tem uma conta? <a href="#">Faça o login</a>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
